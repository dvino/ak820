name: Feature Request
description: Suggest a supported function or improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        This project supports the wired AJAZZ AK820 with the VS11K28A/CH555 controller and USB ID 320F:505B only. V2, Pro, and Max models are not supported.

        Do not upload OEM ROMs, full-ROM dumps, recovery images, settings backups, or private sessions.
  - type: dropdown
    id: feature-area
    attributes:
      label: Feature area
      options:
        - Firmware function
        - Installer or recovery tool
        - Documentation
        - Other or unsure
    validations:
      required: true
  - type: textarea
    id: requested-function
    attributes:
      label: Requested function
      description: Describe what the firmware or related tool should do.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Explain when this would be useful and what problem it would solve.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe any current workaround or alternative.
    validations:
      required: false
