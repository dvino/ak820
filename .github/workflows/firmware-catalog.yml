name: AK820 manual candidate catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ak820-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-catalog:
    name: Linux nine-profile offline candidate catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CATALOG_RUN: catalog-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qmk-8051-ak820/requirements-ak820-build.txt
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libudev-dev libusb-1.0-0-dev
      - name: Install pinned SDCC and LUFA sources
        run: |
          python tools/install_sdcc46_toolchain.py
          python tools/install_lufa_dependency.py --fetch
      - name: Set up the pinned QMK build environment
        working-directory: qmk-8051-ak820
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ak820-build.txt
      - name: Build and qualify all nine candidates
        run: >-
          python tools/build_profile_catalog.py
          --build-root "qmk-8051-ak820/.build/$CATALOG_RUN"
          --output "dist/$CATALOG_RUN"
          --toolchain toolchains/sdcc-4.6.0
          --qmk-bin qmk-8051-ak820/.venv/bin/qmk
          --python qmk-8051-ak820/.venv/bin/python
      - name: Retain complete generated build evidence
        if: always()
        run: |
          if [ -d "qmk-8051-ak820/.build/$CATALOG_RUN" ]; then
            mkdir -p dist
            tar -czf "dist/$CATALOG_RUN-evidence.tar.gz" \
              -C qmk-8051-ak820/.build "$CATALOG_RUN"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: ak820-offline-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/${{ env.CATALOG_RUN }}.zip
            dist/${{ env.CATALOG_RUN }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ak820-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ env.CATALOG_RUN }}-evidence.tar.gz
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
