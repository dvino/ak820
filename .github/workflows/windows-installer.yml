name: AK820 CI and Windows release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ak820-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-regression:
    name: Linux syntax, host, CPU, and pinned firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qmk-8051-ak820/requirements-ak820-build.txt
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libudev-dev libusb-1.0-0-dev
      - name: Install pinned SDCC and LUFA sources
        run: |
          python tools/install_sdcc46_toolchain.py
          python tools/install_lufa_dependency.py --fetch
      - name: Set up the pinned QMK build environment
        working-directory: qmk-8051-ak820
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ak820-build.txt
      - name: Validate GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Check Python and shell syntax
        run: python tools/ci_checks.py
      - name: Check project Python for correctness errors
        run: |
          python -m pip install -r tools/requirements-ci.txt
          python -m ruff check --no-cache --select F601,F631,F821,F822,F823 \
            tools qmk-8051-ak820/util/ak820_*.py \
            qmk-8051-ak820/util/build_ak820.py qmk-8051-ak820/util/pack_ak820.py \
            qmk-8051-ak820/util/prepare_ak820_trial.py
      - name: Run all host tool unit tests
        run: python -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check compiler version selection
        run: python -B -m unittest discover -s qmk-8051-ak820/tests/ak820_compiler -p 'test_*.py' -v
      - name: Build pinned firmware application
        working-directory: qmk-8051-ak820
        run: >-
          .venv/bin/python util/build_ak820.py --sdcc-version 4.6.0
          --toolchain ../toolchains/sdcc-4.6.0 --qmk-bin .venv/bin/qmk
          --build-dir .build/ci
      - name: Run installer, host, and linked CPU regressions
        run: >-
          python tools/test_keyboard.py --host
          --build-dir qmk-8051-ak820/.build/ci --require-toolchain
          --toolchain toolchains/sdcc-4.6.0 --iap-fault-profile guarded-erase
          --output host/runs/ci.json
      - name: Run NVM host power-loss model
        working-directory: qmk-8051-ak820
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-clobbered \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ikeyboards/ajazz/ak820 \
            keyboards/ajazz/ak820/tests/nvm_powercut.c \
            keyboards/ajazz/ak820/ak820_nvm.c \
            -o "$RUNNER_TEMP/nvm-powercut"
          "$RUNNER_TEMP/nvm-powercut" | tee ../host/runs/ci-nvm-powercut.log
      - name: Run macro storage host power-loss model
        working-directory: qmk-8051-ak820
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-clobbered \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wno-int-to-pointer-cast -DAK820_BOARD= \
            -Ikeyboards/ajazz/ak820/tests/include -Ikeyboards/ajazz/ak820 \
            keyboards/ajazz/ak820/tests/macro_powercut.c \
            keyboards/ajazz/ak820/ak820_macro.c \
            keyboards/ajazz/ak820/ak820_nvm.c \
            -o "$RUNNER_TEMP/macro-powercut"
          "$RUNNER_TEMP/macro-powercut" | tee ../host/runs/ci-macro-powercut.log
      - name: Assemble public bundle from this CI build
        run: >-
          python tools/build_ci_release.py
          --build-dir "$GITHUB_WORKSPACE/qmk-8051-ak820/.build/ci"
          --qualification host/runs/ci.json
          --policy ci/release-policy.json
          --program-review ci/program-review.md
          --packing-receipt ci/packing-receipt.json
          --output dist/firmware-bundle
          --toolchain toolchains/sdcc-4.6.0
          --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ak820-linked-application-not-flashable
          path: |
            host/runs/ci.json
            qmk-8051-ak820/.build/ci/ajazz_ak820_vial.ihx
            qmk-8051-ak820/.build/ci/ajazz_ak820_vial.map
            qmk-8051-ak820/.build/ci/ajazz_ak820_vial.mem
            qmk-8051-ak820/.build/ci/build-report.json
            host/runs/ci-logs-*/**
            host/runs/ci-nvm-powercut.log
            host/runs/ci-macro-powercut.log
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: ak820-fresh-ci-firmware
          path: |
            dist/firmware-bundle/**
            dist/firmware-bundle.zip
            dist/firmware-bundle.zip.sha256
          if-no-files-found: error
          retention-days: 30

  windows-package:
    name: Native Windows package build and smoke
    needs: linux-regression
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ak820-fresh-ci-firmware
          path: dist/ci-firmware
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/installer/requirements-build-windows.txt
      - name: Install pinned package build requirements
        run: python -m pip install -r tools/installer/requirements-build-windows.txt
      - name: Run Windows packaging regressions
        run: python tools/test_build_windows_installer.py
      - name: Verify and overlay fresh CI firmware
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $bundle = Resolve-Path dist/ci-firmware/firmware-bundle
          $attestation = Get-Content "$bundle/reports/build-attestation.json" -Raw | ConvertFrom-Json
          if ($attestation.source_commit -cne $env:SOURCE_COMMIT) {
            throw "Firmware bundle source commit $($attestation.source_commit) does not match $env:SOURCE_COMMIT"
          }
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_COMMIT) {
            throw "Windows checkout does not match firmware source commit $env:SOURCE_COMMIT"
          }
          $checksumLine = Get-Content dist/ci-firmware/firmware-bundle.zip.sha256 -Raw
          if ($checksumLine -notmatch '^([0-9a-f]{64})  firmware-bundle\.zip\s*$') {
            throw 'Fresh firmware checksum file has an unexpected format'
          }
          $actualHash = (Get-FileHash dist/ci-firmware/firmware-bundle.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $Matches[1]) { throw 'Fresh firmware ZIP checksum failed' }
          Remove-Item releases/rc6 -Recurse -Force
          New-Item releases/rc6 -ItemType Directory | Out-Null
          Copy-Item "$bundle/*" releases/rc6 -Recurse
          Copy-Item "$bundle/approved-release.json" tools/installer/approved-release.json -Force
      - name: Build and smoke-test approved package
        run: python tools/build_windows_installer.py --output dist/AK820-Windows
      - name: Write package checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AK820-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AK820-Windows.zip" | Set-Content -NoNewline dist/AK820-Windows.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ak820-reviewed-windows-portable
          path: |
            dist/AK820-Windows.zip
            dist/AK820-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged version from main
    needs: [linux-regression, windows-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ak820-reviewed-windows-portable
          path: dist/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ak820-fresh-ci-firmware
          path: dist/firmware
      - name: Verify release trigger and asset hashes
        id: release
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python tools/release_version.py "$TAG_NAME" >> "$GITHUB_OUTPUT"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          (cd dist/windows && sha256sum --check AK820-Windows.zip.sha256)
          (cd dist/firmware && sha256sum --check firmware-bundle.zip.sha256)
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          bundle = Path('dist/firmware/firmware-bundle')
          attestation = json.loads((bundle / 'reports/build-attestation.json').read_text(encoding='utf-8'))
          if attestation.get('source_commit') != os.environ['SOURCE_COMMIT']:
              raise SystemExit('firmware bundle source commit mismatch')
          manifest = json.loads((bundle / 'installer-release.json').read_text(encoding='utf-8'))
          with zipfile.ZipFile('dist/windows/AK820-Windows.zip') as package:
              for app in ('AK820', 'AK820-cli'):
                  prefix = f'AK820-Windows/{app}/_internal/'
                  checks = ['installer-release.json', *manifest['files']]
                  checks.extend(['approved-release.json'])
                  for name in checks:
                      if name == 'approved-release.json':
                          source = bundle / name
                          packaged = prefix + 'tools/installer/approved-release.json'
                      else:
                          source = bundle / name
                          packaged = prefix + 'releases/rc6/' + name
                      expected = hashlib.sha256(source.read_bytes()).hexdigest()
                      actual = hashlib.sha256(package.read(packaged)).hexdigest()
                      if actual != expected:
                          raise SystemExit(f'{app} package does not contain fresh CI input: {name}')
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            dist/windows/AK820-Windows.zip dist/windows/AK820-Windows.zip.sha256
            dist/firmware/firmware-bundle.zip dist/firmware/firmware-bundle.zip.sha256
            --title "AK820 $RELEASE_TAG"
            --notes "Portable Windows installer and public firmware bundle built and checked from commit $GITHUB_SHA. Checksums cover both ZIP files."
          )
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            gh release create "${args[@]}" --verify-tag --prerelease
          else
            gh release create "${args[@]}" --verify-tag
          fi
