name: AK820 CI and Windows release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      qualified_run_id:
        description: Completed qualification run to reuse (empty runs full qualification)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ak820-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-regression:
    name: Linux syntax and shared host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qmk-8051-ak820/requirements-ak820-build.txt
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libudev-dev libusb-1.0-0-dev
      - name: Install pinned SDCC and LUFA sources
        run: |
          python tools/install_sdcc46_toolchain.py
          python tools/install_lufa_dependency.py --fetch
      - name: Set up the pinned QMK build environment
        working-directory: qmk-8051-ak820
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ak820-build.txt
      - name: Validate GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Check Python and shell syntax
        run: python tools/ci_checks.py
      - name: Check project Python for correctness errors
        run: |
          python -m pip install -r tools/requirements-ci.txt
          python -m ruff check --no-cache --select F601,F631,F821,F822,F823 \
            tools qmk-8051-ak820/util/ak820_*.py \
            qmk-8051-ak820/util/build_ak820.py qmk-8051-ak820/util/pack_ak820.py \
            qmk-8051-ak820/util/prepare_ak820_trial.py
      - name: Run all host tool unit tests
        run: python -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check compiler version selection
        run: python -B -m unittest discover -s qmk-8051-ak820/tests/ak820_compiler -p 'test_*.py' -v
      - name: Check compiler metadata capture contracts
        run: python -B -m unittest discover -s qmk-8051-ak820/tests/ak820_parameter_spills -p 'test_*.py' -v
      - name: Run NVM host power-loss model
        working-directory: qmk-8051-ak820
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-clobbered \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ikeyboards/ajazz/ak820 \
            keyboards/ajazz/ak820/tests/nvm_powercut.c \
            keyboards/ajazz/ak820/ak820_nvm.c \
            keyboards/ajazz/ak820/ak820_crc.c \
            -o "$RUNNER_TEMP/nvm-powercut"
          "$RUNNER_TEMP/nvm-powercut" | tee "$RUNNER_TEMP/nvm-powercut.log"
      - name: Run macro storage host power-loss model
        working-directory: qmk-8051-ak820
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-clobbered \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wno-int-to-pointer-cast -DAK820_BOARD= \
            -Ikeyboards/ajazz/ak820/tests/include -Ikeyboards/ajazz/ak820 \
            keyboards/ajazz/ak820/tests/macro_powercut.c \
            keyboards/ajazz/ak820/ak820_macro.c \
            keyboards/ajazz/ak820/ak820_nvm.c \
            keyboards/ajazz/ak820/ak820_crc.c \
            -o "$RUNNER_TEMP/macro-powercut"
          "$RUNNER_TEMP/macro-powercut" | tee "$RUNNER_TEMP/macro-powercut.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ak820-shared-host-models
          path: |
            ${{ runner.temp }}/nvm-powercut.log
            ${{ runner.temp }}/macro-powercut.log
          if-no-files-found: warn
          retention-days: 30

  linux-profile:
    if: github.event_name != 'workflow_dispatch' || inputs.qualified_run_id == ''
    name: Qualify firmware (${{ matrix.profile }})
    needs: linux-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [main, game, mmo, typing, code, pointer, onehand, creative, shortcuts, multios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qmk-8051-ak820/requirements-ak820-build.txt
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libudev-dev libusb-1.0-0-dev
      - name: Install pinned SDCC and LUFA sources
        run: |
          python tools/install_sdcc46_toolchain.py
          python tools/install_lufa_dependency.py --fetch
      - name: Set up the pinned QMK build environment
        working-directory: qmk-8051-ak820
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ak820-build.txt
      - name: Build and qualify one pinned release profile
        run: >-
          python tools/build_ci_profiles.py
          --profile "${{ matrix.profile }}"
          --builds-root qmk-8051-ak820/.build/ci-profiles
          --bootstrap-root qmk-8051-ak820/.build/ci-profile-bootstrap
          --toolchain toolchains/sdcc-4.6.0
          --qmk-bin qmk-8051-ak820/.venv/bin/qmk
          --python qmk-8051-ak820/.venv/bin/python
          --report qmk-8051-ak820/.build/ci-profile-builds-${{ matrix.profile }}.json
      - name: Preserve final image and complete bootstrap provenance
        if: success()
        run: >-
          tar -czf "$RUNNER_TEMP/profile-${{ matrix.profile }}.tar.gz"
          qmk-8051-ak820/.build/ci-profiles/${{ matrix.profile }}
          qmk-8051-ak820/.build/ci-profile-bootstrap/${{ matrix.profile }}
          qmk-8051-ak820/.build/ci-profile-builds-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ak820-qualified-profile-${{ matrix.profile }}
          path: ${{ runner.temp }}/profile-${{ matrix.profile }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Preserve partial profile evidence after failure
        if: ${{ failure() || cancelled() }}
        run: |
          if [ -d qmk-8051-ak820/.build ]; then
            tar -czf "$RUNNER_TEMP/failed-profile-${{ matrix.profile }}.tar.gz" qmk-8051-ak820/.build
          else
            printf 'Build did not create an output directory. See job logs.\n' > "$RUNNER_TEMP/no-build-output.txt"
            tar -czf "$RUNNER_TEMP/failed-profile-${{ matrix.profile }}.tar.gz" -C "$RUNNER_TEMP" no-build-output.txt
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() || cancelled() }}
        with:
          name: ak820-failed-profile-evidence-${{ matrix.profile }}
          path: ${{ runner.temp }}/failed-profile-${{ matrix.profile }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  linux-assembly:
    name: Revalidate and assemble all ten profiles
    needs: [linux-regression, linux-profile]
    if: >-
      always() && !cancelled() && needs.linux-regression.result == 'success' &&
      (needs.linux-profile.result == 'success' ||
       (needs.linux-profile.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.qualified_run_id != ''))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qmk-8051-ak820/requirements-ak820-build.txt
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libudev-dev libusb-1.0-0-dev
      - name: Install pinned SDCC and LUFA sources
        run: |
          python tools/install_sdcc46_toolchain.py
          python tools/install_lufa_dependency.py --fetch
      - name: Set up the pinned QMK build environment
        working-directory: qmk-8051-ak820
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ak820-build.txt
      - name: Validate prior qualification before downloading artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.qualified_run_id != ''
        env:
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          PROFILES = "main game mmo typing code pointer onehand creative shortcuts multios".split()
          WORKFLOW = ".github/workflows/windows-installer.yml"


          def require(condition, message):
              if not condition:
                  raise SystemExit(message)


          def allowed_path(path):
              if path == WORKFLOW or path.startswith("audits/"):
                  return True
              if path == "ci/beta4-release-notes.md":
                  return True
              if re.fullmatch(r"(?:README(?:[^/]*)|docs/.+)\.md", path):
                  return True
              return any(path == f"ci/profiles/{profile}/{name}" for profile in PROFILES
                         for name in ("release-policy.json", "program-review.md",
                                      "release-safety.json", "packing-validation.json"))


          def validate_metadata(run, jobs, artifacts, repository, run_id, workflow_id):
              require(str(run.get("id")) == run_id, "Run ID mismatch")
              require(run.get("repository", {}).get("full_name") == repository,
                      "Run repository mismatch")
              require(run.get("head_repository", {}).get("full_name") == repository,
                      "Run head repository mismatch")
              require(run.get("workflow_id") == workflow_id and run.get("path") == WORKFLOW,
                      "Run workflow mismatch")
              require(run.get("status") == "completed", "Run is not completed")
              head = run.get("head_sha", "")
              require(re.fullmatch(r"[0-9a-f]{40}", head) is not None, "Invalid source SHA")
              for profile in PROFILES:
                  matches = [job for job in jobs if job.get("name") == f"Qualify firmware ({profile})"]
                  require(len(matches) == 1 and matches[0].get("status") == "completed"
                          and matches[0].get("conclusion") == "success",
                          "Missing, duplicate or unsuccessful latest qualification: " + profile)
              qualified = [a for a in artifacts if a.get("name", "").startswith("ak820-qualified-profile-")]
              expected = {"ak820-qualified-profile-" + p for p in PROFILES}
              require(len(qualified) == 10 and {a.get("name") for a in qualified} == expected,
                      "Missing, duplicate or unexpected qualified artifact")
              require(all(a.get("expired") is False for a in qualified), "Expired qualified artifact")
              return head


          def main():
              run_id = os.environ["QUALIFIED_RUN_ID"]
              require(re.fullmatch(r"[1-9][0-9]*", run_id) is not None, "Invalid numeric run ID")
              require(os.environ["EVENT_NAME"] == "workflow_dispatch"
                      and os.environ["REF"].startswith("refs/tags/v"),
                      "Reuse requires dispatch on a version tag")
              repository = os.environ["GITHUB_REPOSITORY"]
              require(re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) is not None,
                      "Invalid repository")
              base = os.environ["GITHUB_API_URL"] + "/repos/" + repository + "/actions/"

              def api(path):
                  request = urllib.request.Request(base + path, headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)

              def pages(path, key):
                  result = []
                  page = 1
                  while True:
                      data = api(path + ("&" if "?" in path else "?") + f"per_page=100&page={page}")[key]
                      result.extend(data)
                      if len(data) < 100:
                          return result
                      page += 1

              run = api("runs/" + run_id)
              workflow = api("workflows/windows-installer.yml")
              head = validate_metadata(run, pages("runs/" + run_id + "/jobs?filter=latest", "jobs"),
                                       pages("runs/" + run_id + "/artifacts", "artifacts"),
                                       repository, run_id, workflow["id"])
              current = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              require(current == os.environ["GITHUB_SHA"], "Checkout source mismatch")
              subprocess.run(["git", "merge-base", "--is-ancestor", head, current], check=True)
              changed = subprocess.check_output(["git", "diff", "--name-only", "-z", head, current]).decode().split("\0")
              rejected = [path for path in changed if path and not allowed_path(path)]
              require(not rejected, "Unqualified source changes: " + repr(rejected))
              print("Qualified artifact reuse accepted from " + run_id + " at " + head)


          if __name__ == "__main__":
              main()
          PYTHON
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualified_run_id || github.run_id }}
          pattern: ak820-qualified-profile-*
          path: ${{ runner.temp }}/qualified-profiles
          merge-multiple: true
      - name: Restore all ten complete build trees at their original checkout paths
        run: |
          for profile in main game mmo typing code pointer onehand creative shortcuts multios; do
            tar -xzf "$RUNNER_TEMP/qualified-profiles/profile-$profile.tar.gz"
          done
      - name: Assemble all independently authorized profile bundles
        run: >-
          "$(readlink -f qmk-8051-ak820/.venv/bin/python)" tools/ci_parallel_assembly.py
          --validation-workers 4
          --all-profiles
          --builds-root qmk-8051-ak820/.build/ci-profiles
          --policies-root ci/profiles
          --settings-catalog tools/installer/settings-catalog.json
          --output dist/ci-firmware
          --toolchain toolchains/sdcc-4.6.0
          --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: ak820-fresh-ci-firmware
          path: |
            dist/ci-firmware/**
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged version from main
    needs: [linux-assembly]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualified_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ak820-fresh-ci-firmware
          path: dist/firmware
      - name: Verify release trigger and asset hashes
        id: release
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python tools/release_version.py "$TAG_NAME" >> "$GITHUB_OUTPUT"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          catalog = json.loads(Path('tools/installer/profile-catalog.json').read_text())
          bundles = {}
          for profile in catalog['profiles']:
              bundle = Path('dist/firmware/profiles') / profile['id']
              attestation = json.loads((bundle / 'reports/build-attestation.json').read_text(encoding='utf-8'))
              if attestation.get('source_commit') != os.environ['SOURCE_COMMIT']:
                  raise SystemExit('firmware bundle source commit mismatch: ' + profile['id'])
              bundles[profile['id']] = bundle
          shutil.copytree('dist/firmware/profiles', 'releases/beta3')
          PY
      - name: Use catalogs measured from the approved CI images
        run: |
          cp dist/firmware/reports/firmware-matrix.json web/firmware-matrix.json
          cp dist/firmware/reports/capability-catalog.json web/capability-catalog.json
      - name: Install pinned external sources for catalog verification
        run: python tools/install_lufa_dependency.py --fetch
      - name: Prepare companion catalogs and installation guides
        run: >-
          python tools/build_beta_release_assets.py
          --bundles-root releases/beta3
          --output dist/catalog
          --tag "${{ github.ref_name }}"
      - name: Name the beta.4 catalog archive
        run: |
          mv dist/catalog/AK820-Beta3-Catalog.zip dist/catalog/AK820-Beta4-Catalog.zip
          rm dist/catalog/AK820-Beta3-Catalog.zip.sha256
          cd dist/catalog
          sha256sum AK820-Beta4-Catalog.zip > AK820-Beta4-Catalog.zip.sha256
          sed -i 's/AK820-Beta3-Catalog.zip/AK820-Beta4-Catalog.zip/g' SHA256SUMS
      - name: Verify Python package and catalog checksums
        run: |
          cd dist/catalog
          sha256sum --check AK820-Windows.zip.sha256
          sha256sum --check AK820-Linux-x86_64.tar.gz.sha256
          sha256sum --check AK820-Beta4-Catalog.zip.sha256
          sha256sum --check SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            dist/firmware/firmware-bundle.zip dist/firmware/firmware-bundle.zip.sha256
            dist/catalog/AK820-Windows.zip dist/catalog/AK820-Windows.zip.sha256
            dist/catalog/AK820-Linux-x86_64.tar.gz dist/catalog/AK820-Linux-x86_64.tar.gz.sha256
            dist/catalog/AK820-Beta4-Catalog.zip dist/catalog/AK820-Beta4-Catalog.zip.sha256
            dist/catalog/firmware-matrix.json dist/catalog/capability-catalog.json
            dist/catalog/module-descriptions.json dist/catalog/release-catalog.json
            dist/catalog/release-manifest.json dist/catalog/SHA256SUMS
            dist/catalog/INSTALL-en.md dist/catalog/INSTALL-ru.md
            --title "AK820 $RELEASE_TAG"
            --notes-file ci/beta4-release-notes.md
          )
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            gh release create "${args[@]}" --verify-tag --prerelease
          else
            gh release create "${args[@]}" --verify-tag
          fi
